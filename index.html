<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1217">
  <title>Mandarin Games — Administration Medium RP</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #0b1117;
      --bg-2: #121d24;
      --panel: rgba(18, 27, 33, 0.9);
      --panel-strong: rgba(11, 17, 23, 0.96);
      --surface: rgba(25, 35, 42, 0.9);
      --soft: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.12);
      --text: #eef2eb;
      --muted: #b7c0b9;
      --gold: #f5cb8b;
      --gold-strong: #f4b766;
      --green: #8bd9b7;
      --rose: #ff9c8c;
      --shadow: rgba(0, 0, 0, 0.35);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at 15% 18%, rgba(246, 191, 120, 0.18), transparent 18%),
        radial-gradient(circle at 80% 12%, rgba(146, 202, 255, 0.12), transparent 22%),
        linear-gradient(180deg, #091116 0%, #0a1117 20%, #0c151a 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 10% 14%, rgba(255,255,255,0.65), transparent 100%),
        radial-gradient(1.7px 1.7px at 28% 22%, rgba(255,255,255,0.52), transparent 100%),
        radial-gradient(1.8px 1.8px at 42% 15%, rgba(255,255,255,0.6), transparent 100%),
        radial-gradient(2px 2px at 70% 24%, rgba(255,255,255,0.58), transparent 100%),
        radial-gradient(1.6px 1.6px at 84% 12%, rgba(255,255,255,0.7), transparent 100%),
        radial-gradient(1.6px 1.6px at 65% 80%, rgba(255,255,255,0.6), transparent 100%);
      opacity: 0.9;
      z-index: 0;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    #app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 26px 20px 40px;
    }

    .shell {
      width: min(1180px, 100%);
      background: rgba(12, 17, 22, 0.82);
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 60px var(--shadow);
      backdrop-filter: blur(16px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(105, 63, 36, 0.84), rgba(22, 28, 33, 0.72));
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f6cf9a, #eaa75a);
      color: #1f140d;
      display: grid;
      place-items: center;
      font-size: 20px;
      box-shadow: 0 10px 16px rgba(239, 185, 97, 0.25);
    }

    .brand-text {
      min-width: 0;
      line-height: 1.1;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tabs {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: nowrap;
      gap: 5px;
      min-width: 0;
      flex: 1;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      border: 1px solid transparent;
      background: rgba(255,255,255,0.02);
      color: rgba(255,255,255,0.8);
      padding: 8px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.2s ease;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .tab:hover {
      border-color: rgba(255,255,255,0.12);
    }

    .tab.active {
      background: rgba(245, 203, 139, 0.12);
      border-color: rgba(245, 203, 139, 0.38);
      color: #fff4de;
      box-shadow: 0 8px 18px rgba(245, 203, 139, 0.14);
    }

    .content-wrap {
      padding: 24px;
    }

    .hero-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    .hero-head .eyebrow { margin-top: 7px; }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(260px, 0.8fr);
      gap: 18px;
      align-items: stretch;
      margin-bottom: 18px;
    }

    .hero-panel,
    .side-panel,
    .panel-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.015));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .hero-panel {
      padding: 22px 22px 18px;
      position: relative;
      overflow: hidden;
    }

    .hero-panel::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(245, 203, 139, 0.18), transparent 66%);
      right: -30px;
      top: -30px;
      pointer-events: none;
    }

    .eyebrow {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 4vw, 4rem);
      line-height: 0.92;
      letter-spacing: -0.06em;
      font-weight: 800;
    }

    .accent {
      color: var(--gold);
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      max-width: 52ch;
      line-height: 1.7;
      font-size: 14px;
    }

    .utility-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .chip.notice {
      color: #ffe9c1;
      background: rgba(245, 203, 139, 0.09);
      border-color: rgba(245, 203, 139, 0.3);
    }

    .chip.good {
      color: #dff9ee;
      background: rgba(139, 217, 183, 0.12);
      border-color: rgba(139, 217, 183, 0.3);
    }

    .side-panel {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
    }

    .status-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
    }

    .status-label {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status-value {
      font-size: 14px;
      font-weight: 700;
    }

    .status-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 22px rgba(139, 217, 183, 0.7);
    }

    .search-wrap {
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
    }

    .search-wrap span {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: rgba(245, 203, 139, 0.09);
      color: var(--gold);
      border: 1px solid rgba(245, 203, 139, 0.22);
    }

    .search-wrap input {
      flex: 1;
      background: transparent;
      border: 0;
      outline: none;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }

    .search-wrap input::placeholder { color: var(--muted); }

    .search-results {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: -8px 0 18px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel-strong);
    }

    .search-results[hidden] { display: none; }

    .search-result {
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 8px 12px;
      background: var(--soft);
      color: var(--text);
      cursor: pointer;
    }

    .search-result:hover { border-color: rgba(245, 203, 139, 0.4); }
    .search-empty { color: var(--muted); padding: 8px; }

    .development {
      min-height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(255,255,255,0.025), rgba(255,255,255,0.01));
      text-align: left;
    }

    .development-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(245, 203, 139, 0.24);
      border-radius: 14px;
      color: var(--gold);
      background: rgba(245, 203, 139, 0.08);
    }

    .development h2 { margin: 0 0 6px; font-size: 20px; }
    .development p { margin: 0; color: var(--muted); font-size: 14px; }

    .guide-document {
      max-width: 920px;
      margin: 0 auto;
      padding: 4px 10px;
    }

    .guide-section {
      padding: 20px 0;
      border-bottom: 1px solid var(--line-strong);
    }

    .guide-section h2 {
      margin: 0 0 18px;
      color: var(--gold-strong);
      font-size: 23px;
      font-weight: 600;
    }

    .guide-section h3 {
      margin: 18px 0 8px;
      color: #9cdb72;
      font-size: 18px;
      font-weight: 500;
    }

    .guide-section p,
    .guide-section li {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }

    .guide-section p { margin: 8px 0; }
    .guide-section ol, .guide-section ul { padding-left: 24px; }

    .hierarchy {
      max-width: 360px;
      margin: 18px auto;
      padding: 0;
      list-style: none;
      text-align: center;
    }

    .hierarchy li { padding: 5px 0; }
    .hierarchy li:not(:last-child)::after { content: "↓"; display: block; color: var(--muted); padding-top: 5px; }

    .guide-note {
      margin: 20px 0 0;
      padding: 16px 18px;
      border: 1px solid rgba(245, 203, 139, 0.24);
      border-radius: 14px;
      background: rgba(245, 203, 139, 0.07);
      color: #ffe5bd;
      line-height: 1.6;
    }

    .data-table-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(13, 19, 24, 0.9);
    }

    .data-table-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(208, 91, 96, 0.2), rgba(245, 203, 139, 0.05));
    }

    .data-table-head h2 { margin: 0; font-size: 15px; }

    .stale-badge {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid rgba(255, 74, 74, 0.45);
      border-radius: 999px;
      background: rgba(255, 50, 50, 0.12);
      color: #ff6969;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .table-scroll { overflow: auto; max-height: min(68vh, 680px); }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      white-space: nowrap;
    }

    .data-table.staff-table { min-width: 1850px; }
    .data-table.violations-table { min-width: 1050px; }

    .data-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 10px 11px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #a94c50;
      color: #fff4ef;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
    }

    .data-table td {
      padding: 9px 11px;
      border: 1px solid rgba(255,255,255,0.07);
      color: var(--muted);
    }

    .data-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.025); }

    .data-table .table-empty {
      padding: 28px 18px;
      color: var(--muted);
      text-align: center;
      white-space: normal;
      line-height: 1.6;
    }

    .table-footnote {
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .auth-page {
      min-height: calc(100vh - 52px);
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }

    .auth-card {
      width: min(460px, 100%);
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(14, 21, 27, 0.94);
      box-shadow: 0 24px 60px var(--shadow);
    }

    .auth-card h1 { font-size: 30px; line-height: 1.12; }
    .auth-intro { margin: 10px 0 22px; color: var(--muted); line-height: 1.6; font-size: 14px; }
    .provider-list { display: grid; gap: 10px; }

    .provider-button,
    .enter-button,
    .copy-button,
    .logout-button {
      min-height: 44px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text);
      background: var(--soft);
      cursor: pointer;
      text-align: left;
    }

    .provider-button { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .provider-button:hover, .copy-button:hover { border-color: rgba(245, 203, 139, 0.42); }
    .provider-state { color: var(--muted); font-size: 12px; }
    .provider-button.connected .provider-state { color: var(--green); }
    .auth-disclaimer { margin: 18px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .enter-button { width: 100%; margin-top: 14px; text-align: center; background: rgba(245, 203, 139, 0.12); }
    .enter-button:disabled { cursor: not-allowed; opacity: 0.45; }
    .logout-button { min-height: 36px; padding: 7px 11px; font-size: 12px; }

    .cassie-card {
      position: relative;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: radial-gradient(ellipse at 92% 0%, rgba(245, 166, 78, 0.12), transparent 34%), rgba(14, 21, 27, 0.88);
      border-color: rgba(245, 203, 139, 0.18);
      overflow: hidden;
    }

    .cassie-card-head {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 22px;
      border-bottom: 1px solid var(--line);
    }

    .cassie-card-head::after {
      content: "🍊";
      position: absolute;
      top: 50%;
      right: 205px;
      transform: translateY(-50%);
      font-size: 72px;
      opacity: 0.075;
      pointer-events: none;
    }

    .cassie-card-head h2 { margin: 0 0 7px; font-size: 21px; }
    .cassie-card-head p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .copy-button {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex: 0 0 auto;
      text-align: center;
      border-color: rgba(245, 183, 102, 0.28);
      background: linear-gradient(135deg, rgba(245, 183, 102, 0.17), rgba(245, 203, 139, 0.07));
      box-shadow: 0 5px 18px rgba(245, 157, 64, 0.08);
      transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .copy-button:hover {
      background: linear-gradient(135deg, rgba(245, 183, 102, 0.27), rgba(245, 203, 139, 0.12));
      box-shadow: 0 8px 22px rgba(245, 157, 64, 0.16);
      transform: translateY(-1px);
    }

    .copy-button:active { transform: scale(0.98); }
    .copy-icon { color: var(--gold); font-size: 18px; line-height: 1; }
    .copy-button.copied { border-color: rgba(139, 217, 183, 0.4); }
    .copy-button.copied .copy-icon { color: var(--green); animation: copyConfirm 0.35s ease; }

    @keyframes copyConfirm {
      50% { transform: scale(1.25); }
    }

    .cassie-message {
      max-height: 440px;
      overflow: auto;
      margin: 0;
      padding: 20px 22px;
      color: #e4e9e5;
      font: 13px/1.8 'JetBrains Mono', 'SFMono-Regular', monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      user-select: text;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .panel-card {
      padding: 18px 18px 16px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .panel-card::before {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(245, 203, 139, 0.35), transparent);
      opacity: 0.8;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-tag {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(245, 203, 139, 0.08);
      border: 1px solid rgba(245, 203, 139, 0.18);
      padding: 6px 8px;
      border-radius: 999px;
    }

    .card-badge {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .panel-card h3 {
      margin: 0 0 10px;
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      letter-spacing: -0.04em;
    }

    .panel-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 13px;
    }

    .empty {
      padding: 22px 18px;
      border: 1px dashed rgba(255,255,255,0.14);
      border-radius: 16px;
      color: var(--muted);
      background: rgba(255,255,255,0.01);
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 940px) {
      .hero { grid-template-columns: 1fr; }
      .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar { flex-direction: column; align-items: flex-start; }
      .tabs { width: 100%; justify-content: flex-start; }
    }

    @media (max-width: 620px) {
      #app { padding: 18px 12px 28px; }
      .content-wrap { padding: 16px; }
      .cards-grid { grid-template-columns: 1fr; }
      .topbar { padding: 14px 16px; }
      .brand-name { letter-spacing: 0.06em; }
      .development { min-height: 150px; padding: 20px; }
      .auth-card { padding: 24px 20px; }
      .cassie-card-head { flex-direction: column; }
      .copy-button { width: 100%; }
      .cassie-card-head::after { right: 12px; top: 22px; font-size: 54px; }
      .cassie-message { max-height: 55vh; padding: 16px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const pages = {
      home: { label: 'Главная', title: 'Администрация Medium RP', subtitle: 'Рабочее пространство администрации SCP: Secret Laboratory · Mandarin Games.' },
      guide: { label: 'Руководство', title: 'Руководство отдела Medium RP', subtitle: 'Основные положения, иерархия и правила администрации.' },
      staff: { label: 'Персонал', title: 'Персонал проекта', subtitle: 'Таблица администрации Mandarin RU Medium RP.' },
      violations: { label: 'Таблица частых нарушителей', title: 'Частые нарушители', subtitle: 'Таблица учёта нарушений администрации Medium RP · данные неактуальны.', searchText: 'неактуально никнейм steamid баны комментарий минимальный срок бана поставлен на учёт последний бан' },
      cassie: { label: 'C.A.S.S.I.E.', title: 'C.A.S.S.I.E.', subtitle: 'Оповещения для персонала комплекса.' }
    };

    const cassieMessage = String.raw`Cassieadvanced custom true 35 <split><split><size=21><b><color=#646eff>НОУС</color> | Внимание всему персоналу комплекса: <size=0></b>.........................................................................................................................................<size=21><b>На территории зоны замечено <color=#ff4747>Н</color>арушение <color=#ff4747>О</color>собых <color=#ff4747>У</color>словий <color=#ff4747>С</color>одержания(<color=#ff4747>НОУС</color>) [2] <color=red>SCP-объекта</color> класса <color=red>“Кетер”</color> и <color=#ffcc00>“Евклид”.</color> <size=0></b>............................................................................................................................................................................................................................................................................................................................................<size=21><b>Всему персоналу требуется немедленно пройти в <color=#008a05>безопасные зоны</color> и ожидать дальнейших указаний <color=#919191>Службы Безопасности. <size=0> $pitch_0.3 .g4 .g4 .g4 $pitch_0.9 attention . to all facility personnel . inside the complex detected containment breach 2 SCPSubject _SUFFIX_PLURAL_REGULAR class Keter and Euclid . $pitch_0.8 attention to all personnel . report a near _SUFFIX_EST safe area and wait other order _SUFFIX_PLURAL_REGULAR by security personnel . $pitch_0.3 .g5 $pitch_0.2 .g5`;

    const guideSearchText = `Введение. Назначение документа. Настоящее руководство определяет структуру, обязанности, стандарты работы и процедуры сотрудников администрации MediumRP. Фан-системы, нарушения, игровое сообщество, отчётность, таблица частых нарушителей, операторы C.A.S.S.I.E. Цель администрации — стабильная честная интересная игровая среда, баланс MediumRP и игрового процесса, профессиональная атмосфера. Иерархия и подчинение: Глава отдела ГО, заместитель главы ЗГО, старший администратор, администратор, старший модератор, модератор, стажёр. Приказы вышестоящих обязательны, обжалование руководству. Уровни доступа и повышения: стажёр, модератор, повышение за месяц без взысканий, повышение за заслуги, одобрение руководства, испытательный срок, отказ. Права администрации MRP. Правила фан-режима. Noclip запрещено частое использование, разрешено для технических неполадок и помощи игрокам. Админ-панель, злоупотребление, личная выгода, дискомфорт, ролевой процесс RP, выдача предметов, эффекты, санкции, предупреждения, выговоры, варны. Полный перечень прав в разработке. Остальное руководство в разработке.`;
    const staffSearchText = 'DiscordName DiscordID Discord SteamID должность слоты отпуск время МСК фан-режим варны варн ожидание поступление повышение расписание понедельник вторник среда четверг пятница суббота воскресенье';
    const staffColumns = ['№', 'DiscordName', 'DiscordID', 'SteamID', 'Должность', 'Слоты', 'Отпуск', 'Время отыгрыша', 'Фан-режим', 'Варны', 'Варн №1 выдан', 'Ожидание до', 'Варн №2 выдан', 'Ожидание до', 'Поступление', 'Повышение', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
    const violationsColumns = ['№', 'Никнейм', 'SteamID', 'Баны', 'Комментарий', 'Минимальный срок бана', 'Поставлен на учёт', 'Последний бан'];

    function renderDataTable(columns, tableClass, emptyMessage) {
      return `<div class="table-scroll"><table class="data-table ${tableClass}"><thead><tr>${columns.map(column => `<th scope="col">${column}</th>`).join('')}</tr></thead><tbody><tr><td class="table-empty" colspan="${columns.length}">${emptyMessage}</td></tr></tbody></table></div>`;
    }

    const state = {
      activePage: 'home',
      query: '',
      searchTimer: null,
      authenticated: false,
      providers: { google: false, steam: false }
    };

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    function renderAuth() {
      document.getElementById('app').innerHTML = `
        <main class="auth-page">
          <section class="auth-card" aria-labelledby="loginTitle">
            <div class="brand-mark">🍊</div>
            <div class="eyebrow">Mandarin Games · SCP: Secret Laboratory</div>
            <h1 id="loginTitle">Вход в кабинет</h1>
            <p class="auth-intro">Для продолжения подключите Google и Steam.</p>
            <div class="provider-list">
              <button class="provider-button ${state.providers.google ? 'connected' : ''}" data-provider="google">
                <span>Продолжить с Google</span>
                <span class="provider-state">${state.providers.google ? 'Подключён (демо)' : 'Не подключён'}</span>
              </button>
              <button class="provider-button ${state.providers.steam ? 'connected' : ''}" data-provider="steam">
                <span>Продолжить со Steam</span>
                <span class="provider-state">${state.providers.steam ? 'Подключён (демо)' : 'Не подключён'}</span>
              </button>
            </div>
            <p class="auth-disclaimer">Демо-режим: кнопки показывают макет входа, но не выполняют реальную проверку аккаунтов. Для настоящей авторизации требуется настроить Google OAuth и Steam OpenID на сервере.</p>
            <button class="enter-button" data-enter ${state.providers.google && state.providers.steam ? '' : 'disabled'}>Открыть кабинет</button>
          </section>
        </main>
      `;

      document.querySelectorAll('[data-provider]').forEach(button => {
        button.addEventListener('click', () => {
          state.providers[button.dataset.provider] = true;
          renderAuth();
        });
      });

      document.querySelector('[data-enter]').addEventListener('click', () => {
        if (!state.providers.google || !state.providers.steam) return;
        state.authenticated = true;
        render();
      });
    }

    function renderSearchResults() {
      const query = state.query.trim().toLocaleLowerCase('ru');
      const results = document.getElementById('searchResults');
      if (!results) return;

      if (!query) {
        results.innerHTML = '';
        results.hidden = true;
        return;
      }

      const matches = Object.entries(pages).filter(([key, page]) => {
        const fullText = [page.label, page.title, page.subtitle];
        if (key === 'guide') fullText.push(guideSearchText);
        if (key === 'cassie') fullText.push(cassieMessage);
        if (key === 'staff') fullText.push(staffSearchText);
        if (page.searchText) fullText.push(page.searchText);
        return fullText.join(' ').toLocaleLowerCase('ru').includes(query);
      });

      results.hidden = false;
      results.innerHTML = matches.length
        ? matches.map(([key, page]) => `<button class="search-result" data-result="${key}">${page.label}</button>`).join('')
        : '<span class="search-empty">Ничего не найдено</span>';

      results.querySelectorAll('[data-result]').forEach(button => {
        button.addEventListener('click', () => {
          state.activePage = button.dataset.result;
          state.query = '';
          render();
        });
      });
    }

    function render() {
      const page = pages[state.activePage];
      const nav = Object.entries(pages).map(([key, item]) => `
        <button class="tab ${state.activePage === key ? 'active' : ''}" data-page="${key}">${item.label}</button>
      `).join('');

      document.getElementById('app').innerHTML = `
        <div class="shell">
          <header class="topbar">
            <div class="brand">
              <div class="brand-mark">🍊</div>
              <div class="brand-text">
                <div class="brand-name">Mandarin Games</div>
                <div class="brand-sub">Administration Medium RP · SCP:SL</div>
              </div>
            </div>
            <nav class="tabs" aria-label="Основные разделы">${nav}</nav>
          </header>
          <div class="content-wrap">
            <section class="hero-panel">
              <div class="hero-head">
                <div class="eyebrow">${page.label}</div>
                <button class="logout-button" data-logout>Выйти</button>
              </div>
              <h1>${page.title}</h1>
              <div class="subtitle">${page.subtitle}</div>
            </section>
            <div class="search-wrap" aria-label="Поиск по разделам">
              <span aria-hidden="true">⌕</span>
              <input id="searchInput" type="search" placeholder="Поиск по разделам..." autocomplete="off" />
            </div>
            <div id="searchResults" class="search-results" hidden></div>
            ${state.activePage === 'staff' ? `
              <section class="data-table-card" aria-label="Таблица персонала">
                <header class="data-table-head"><h2>Таблица администрации Mandarin RU Medium RP</h2></header>
                ${renderDataTable(staffColumns, 'staff-table', 'В рабочей папке нет исходного XLSX/CSV. Прикреплённый снимок не содержит данных в виде таблицы, поэтому реальные записи и идентификаторы не подменены вымышленными.')}
                <div class="table-footnote">Структура и столбцы подготовлены по снимку. Для заполнения реальными строками нужен файл исходной таблицы.</div>
              </section>
            ` : state.activePage === 'violations' ? `
              <section class="data-table-card" aria-label="Таблица частых нарушителей">
                <header class="data-table-head"><h2>Частые нарушители Medium RP</h2><span class="stale-badge">НЕАКТУАЛЬНО</span></header>
                ${renderDataTable(violationsColumns, 'violations-table', 'Исходные строки таблицы не импортированы. Данные отмечены как неактуальные.')}
                <div class="table-footnote">Не использовать для принятия решений до обновления исходной таблицы.</div>
              </section>
            ` : state.activePage === 'guide' ? `
              <article class="guide-document">
                <section class="guide-section">
                  <h2>1. Введение</h2>
                  <h3>1.1 Назначение документа</h3>
                  <p>Настоящее руководство определяет структуру, обязанности, стандарты работы и процедуры для сотрудников администрации отдела MediumRP. Документ регламентирует правила использования фан-систем, порядок работы с нарушениями, взаимодействие с игровым сообществом и ведение отчётности, включая таблицу частых нарушителей и работу операторов C.A.S.S.I.E. Руководство обязательно для ознакомления и исполнения всеми сотрудниками отдела.</p>
                  <h3>1.2 Задача администрации</h3>
                  <p>Обеспечение стабильной, честной и интересной игровой среды, соблюдение баланса между ролевой составляющей MediumRP и игровым процессом, поддержание позитивной и профессиональной атмосферы в команде и сообществе.</p>
                </section>
                <section class="guide-section">
                  <h2>2. Структура администрации и иерархия</h2>
                  <h3>2.1 Иерархия и подчинение</h3>
                  <p>Каждый участник администрации обязан соблюдать установленную иерархию:</p>
                  <ol class="hierarchy">
                    <li>Глава отдела (ГО)</li>
                    <li>Заместитель главы отдела (ЗГО)</li>
                    <li>Старший администратор</li>
                    <li>Администратор</li>
                    <li>Старший модератор</li>
                    <li>Модератор</li>
                    <li>Стажёр</li>
                  </ol>
                  <p>Приказы вышестоящего сотрудника обязательны к исполнению. Если приказ кажется некомпетентным или чрезмерно жёстким, его можно обжаловать напрямую руководству отдела.</p>
                  <h3>2.2 Уровни доступа и повышения</h3>
                  <p>Стажёр начинает с ограниченного набора прав. Модератор и старшие должности получают расширенный доступ к инструментам администрирования.</p>
                  <ol>
                    <li>Гарантированное повышение рассматривается после месяца работы без предупреждений, выговоров и других взысканий.</li>
                    <li>Повышение за заслуги возможно в любое время при отсутствии взысканий и с одобрения руководства.</li>
                  </ol>
                  <p>Любое повышение требует одобрения руководства отдела. При небольших недочётах может быть назначен дополнительный срок на исправление или отказано в повышении.</p>
                </section>
                <section class="guide-section">
                  <h2>3. Права и правила использования фан-системы</h2>
                  <h3>3.1 Права администрации MRP</h3>
                  <p>Полный перечень прав и разрешённых действий будет добавлен отдельно. Этот раздел пока в разработке.</p>
                  <h3>3.2 Правила фан-режима</h3>
                  <ol>
                    <li><strong>Режим Noclip:</strong> запрещено произвольное и частое использование. Он допустим для решения технических неполадок или оказания помощи игрокам.</li>
                    <li><strong>Админ-панель:</strong> запрещено злоупотреблять инструментами и использовать полномочия в личных целях или для создания дискомфорта.</li>
                    <li><strong>Игровой процесс:</strong> нельзя сознательно препятствовать RP или иным игровым процессам других игроков.</li>
                    <li><strong>Игровой контент:</strong> запрещена выдача предметов, эффектов и подобных элементов без веской причины.</li>
                    <li><strong>Ответственность:</strong> за нарушения применяются санкции, начиная с предупреждений и выговоров.</li>
                  </ol>
                </section>
                <p class="guide-note"><strong>Это ещё не всё руководство.</strong> Остальные разделы и полный перечень правил будут добавлены позже. Сейчас они находятся в разработке.</p>
              </article>
            ` : state.activePage === 'cassie' ? `
              <article class="cassie-card">
                <header class="cassie-card-head">
                  <div>
                    <h2>НОУС 2 — «Кетер» и «Евклид»</h2>
                    <p>Оповещение персоналу комплекса о нарушении особых условий содержания.</p>
                  </div>
                  <button class="copy-button" data-copy><span class="copy-icon" aria-hidden="true">⧉</span><span class="copy-label">Копировать текст</span></button>
                </header>
                <pre class="cassie-message"><code>${escapeHtml(cassieMessage)}</code></pre>
              </article>
            ` : `
              <section class="development" aria-live="polite">
                <span class="development-mark">✦</span>
                <div>
                  <h2>В разработке</h2>
                  <p>Этот раздел появится позже.</p>
                </div>
              </section>
            `}
          </div>
        </div>
      `;

      document.querySelectorAll('[data-page]').forEach(button => {
        button.addEventListener('click', () => {
          state.activePage = button.dataset.page;
          state.query = '';
          history.replaceState(null, '', '#' + state.activePage);
          render();
        });
      });

      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', event => {
        state.query = event.target.value;
        window.clearTimeout(state.searchTimer);
        state.searchTimer = window.setTimeout(renderSearchResults, 300);
      });

      document.querySelector('[data-logout]').addEventListener('click', () => {
        state.authenticated = false;
        state.providers = { google: false, steam: false };
        renderAuth();
      });

      const copyButton = document.querySelector('[data-copy]');
      if (copyButton) {
        copyButton.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(cassieMessage);
          } catch {
            const temporaryInput = document.createElement('textarea');
            temporaryInput.value = cassieMessage;
            temporaryInput.style.position = 'fixed';
            temporaryInput.style.opacity = '0';
            document.body.append(temporaryInput);
            temporaryInput.select();
            document.execCommand('copy');
            temporaryInput.remove();
          }
          copyButton.classList.add('copied');
          copyButton.querySelector('.copy-label').textContent = 'Текст скопирован';
          window.setTimeout(() => {
            copyButton.classList.remove('copied');
            copyButton.querySelector('.copy-label').textContent = 'Копировать текст';
          }, 1800);
        });
      }
    }

    const initialPage = window.location.hash.slice(1);
    if (pages[initialPage]) state.activePage = initialPage;
    state.authenticated ? render() : renderAuth();
  </script>
</body>
</html>
