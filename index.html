<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1217">
  <title>Mandarin Games — Administration</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #0b1117;
      --bg-2: #121d24;
      --panel: rgba(18, 27, 33, 0.9);
      --panel-strong: rgba(11, 17, 23, 0.96);
      --surface: rgba(25, 35, 42, 0.9);
      --soft: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.12);
      --text: #eef2eb;
      --muted: #b7c0b9;
      --gold: #f5cb8b;
      --gold-strong: #f4b766;
      --green: #8bd9b7;
      --rose: #ff9c8c;
      --shadow: rgba(0, 0, 0, 0.35);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at 15% 18%, rgba(246, 191, 120, 0.18), transparent 18%),
        radial-gradient(circle at 80% 12%, rgba(146, 202, 255, 0.12), transparent 22%),
        linear-gradient(180deg, #091116 0%, #0a1117 20%, #0c151a 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 10% 14%, rgba(255,255,255,0.65), transparent 100%),
        radial-gradient(1.7px 1.7px at 28% 22%, rgba(255,255,255,0.52), transparent 100%),
        radial-gradient(1.8px 1.8px at 42% 15%, rgba(255,255,255,0.6), transparent 100%),
        radial-gradient(2px 2px at 70% 24%, rgba(255,255,255,0.58), transparent 100%),
        radial-gradient(1.6px 1.6px at 84% 12%, rgba(255,255,255,0.7), transparent 100%),
        radial-gradient(1.6px 1.6px at 65% 80%, rgba(255,255,255,0.6), transparent 100%);
      opacity: 0.9;
      z-index: 0;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    #app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 26px 20px 40px;
    }

    .shell {
      width: min(1180px, 100%);
      background: rgba(12, 17, 22, 0.82);
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 60px var(--shadow);
      backdrop-filter: blur(16px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(105, 63, 36, 0.84), rgba(22, 28, 33, 0.72));
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f6cf9a, #eaa75a);
      color: #1f140d;
      display: grid;
      place-items: center;
      font-size: 20px;
      box-shadow: 0 10px 16px rgba(239, 185, 97, 0.25);
    }

    .brand-text {
      min-width: 0;
      line-height: 1.1;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tabs {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }

    .tab {
      border: 1px solid transparent;
      background: rgba(255,255,255,0.02);
      color: rgba(255,255,255,0.8);
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.2s ease;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tab:hover {
      border-color: rgba(255,255,255,0.12);
    }

    .tab.active {
      background: rgba(245, 203, 139, 0.12);
      border-color: rgba(245, 203, 139, 0.38);
      color: #fff4de;
      box-shadow: 0 8px 18px rgba(245, 203, 139, 0.14);
    }

    .content-wrap {
      padding: 24px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(260px, 0.8fr);
      gap: 18px;
      align-items: stretch;
      margin-bottom: 18px;
    }

    .hero-panel,
    .side-panel,
    .panel-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.015));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .hero-panel {
      padding: 22px 22px 18px;
      position: relative;
      overflow: hidden;
    }

    .hero-panel::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(245, 203, 139, 0.18), transparent 66%);
      right: -30px;
      top: -30px;
      pointer-events: none;
    }

    .eyebrow {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 4vw, 4rem);
      line-height: 0.92;
      letter-spacing: -0.06em;
      font-weight: 800;
    }

    .accent {
      color: var(--gold);
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      max-width: 52ch;
      line-height: 1.7;
      font-size: 14px;
    }

    .utility-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .chip.notice {
      color: #ffe9c1;
      background: rgba(245, 203, 139, 0.09);
      border-color: rgba(245, 203, 139, 0.3);
    }

    .chip.good {
      color: #dff9ee;
      background: rgba(139, 217, 183, 0.12);
      border-color: rgba(139, 217, 183, 0.3);
    }

    .side-panel {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
    }

    .status-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
    }

    .status-label {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status-value {
      font-size: 14px;
      font-weight: 700;
    }

    .status-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 22px rgba(139, 217, 183, 0.7);
    }

    .search-wrap {
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
    }

    .search-wrap span {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: rgba(245, 203, 139, 0.09);
      color: var(--gold);
      border: 1px solid rgba(245, 203, 139, 0.22);
    }

    .search-wrap input {
      flex: 1;
      background: transparent;
      border: 0;
      outline: none;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }

    .search-wrap input::placeholder { color: var(--muted); }

    .search-results {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: -8px 0 18px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel-strong);
    }

    .search-results[hidden] { display: none; }

    .search-result {
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 8px 12px;
      background: var(--soft);
      color: var(--text);
      cursor: pointer;
    }

    .search-result:hover { border-color: rgba(245, 203, 139, 0.4); }
    .search-empty { color: var(--muted); padding: 8px; }

    .development {
      min-height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(255,255,255,0.025), rgba(255,255,255,0.01));
      text-align: left;
    }

    .development-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(245, 203, 139, 0.24);
      border-radius: 14px;
      color: var(--gold);
      background: rgba(245, 203, 139, 0.08);
    }

    .development h2 { margin: 0 0 6px; font-size: 20px; }
    .development p { margin: 0; color: var(--muted); font-size: 14px; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .panel-card {
      padding: 18px 18px 16px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .panel-card::before {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(245, 203, 139, 0.35), transparent);
      opacity: 0.8;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-tag {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(245, 203, 139, 0.08);
      border: 1px solid rgba(245, 203, 139, 0.18);
      padding: 6px 8px;
      border-radius: 999px;
    }

    .card-badge {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .panel-card h3 {
      margin: 0 0 10px;
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      letter-spacing: -0.04em;
    }

    .panel-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 13px;
    }

    .empty {
      padding: 22px 18px;
      border: 1px dashed rgba(255,255,255,0.14);
      border-radius: 16px;
      color: var(--muted);
      background: rgba(255,255,255,0.01);
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 940px) {
      .hero { grid-template-columns: 1fr; }
      .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar { flex-direction: column; align-items: flex-start; }
      .tabs { justify-content: flex-start; }
    }

    @media (max-width: 620px) {
      #app { padding: 18px 12px 28px; }
      .content-wrap { padding: 16px; }
      .cards-grid { grid-template-columns: 1fr; }
      .topbar { padding: 14px 16px; }
      .brand-name { letter-spacing: 0.06em; }
      .development { min-height: 150px; padding: 20px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const pages = {
      home: { label: 'Главная', title: 'Администрация Minecraft', subtitle: 'Рабочее пространство администрации проекта Mandarin Games.' },
      guide: { label: 'Руководство', title: 'Руководство отдела', subtitle: 'Материалы и инструкции администрации.' },
      staff: { label: 'Персонал', title: 'Персонал проекта', subtitle: 'Состав администрации и распределение ролей.' },
      violations: { label: 'Таблица частых нарушителей', title: 'Частые нарушители', subtitle: 'Таблица учёта нарушений администрации Minecraft.' },
      cassie: { label: 'C.A.S.S.I.E.', title: 'C.A.S.S.I.E.', subtitle: 'Раздел C.A.S.S.I.E. администрации проекта.' }
    };

    const state = {
      activePage: 'home',
      query: '',
      searchTimer: null
    };

    function renderSearchResults() {
      const query = state.query.trim().toLocaleLowerCase('ru');
      const results = document.getElementById('searchResults');
      if (!results) return;

      if (!query) {
        results.innerHTML = '';
        results.hidden = true;
        return;
      }

      const matches = Object.entries(pages).filter(([, page]) =>
        `${page.label} ${page.title} ${page.subtitle}`.toLocaleLowerCase('ru').includes(query)
      );

      results.hidden = false;
      results.innerHTML = matches.length
        ? matches.map(([key, page]) => `<button class="search-result" data-result="${key}">${page.label}</button>`).join('')
        : '<span class="search-empty">Ничего не найдено</span>';

      results.querySelectorAll('[data-result]').forEach(button => {
        button.addEventListener('click', () => {
          state.activePage = button.dataset.result;
          state.query = '';
          render();
        });
      });
    }

    function render() {
      const page = pages[state.activePage];
      const nav = Object.entries(pages).map(([key, item]) => `
        <button class="tab ${state.activePage === key ? 'active' : ''}" data-page="${key}">${item.label}</button>
      `).join('');

      document.getElementById('app').innerHTML = `
        <div class="shell">
          <header class="topbar">
            <div class="brand">
              <div class="brand-mark">🍊</div>
              <div class="brand-text">
                <div class="brand-name">Mandarin Games</div>
                <div class="brand-sub">Administration Minecraft</div>
              </div>
            </div>
            <nav class="tabs" aria-label="Основные разделы">${nav}</nav>
          </header>
          <div class="content-wrap">
            <section class="hero-panel">
              <div class="eyebrow">${page.label}</div>
              <h1>${page.title}</h1>
              <div class="subtitle">${page.subtitle}</div>
            </section>
            <div class="search-wrap" aria-label="Поиск по разделам">
              <span aria-hidden="true">⌕</span>
              <input id="searchInput" type="search" placeholder="Поиск по разделам..." autocomplete="off" />
            </div>
            <div id="searchResults" class="search-results" hidden></div>
            <section class="development" aria-live="polite">
              <span class="development-mark">✦</span>
              <div>
                <h2>В разработке</h2>
                <p>Этот раздел появится позже.</p>
              </div>
            </section>
          </div>
        </div>
      `;

      document.querySelectorAll('[data-page]').forEach(button => {
        button.addEventListener('click', () => {
          state.activePage = button.dataset.page;
          state.query = '';
          history.replaceState(null, '', '#' + state.activePage);
          render();
        });
      });

      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', event => {
        state.query = event.target.value;
        window.clearTimeout(state.searchTimer);
        state.searchTimer = window.setTimeout(renderSearchResults, 300);
      });
    }

    const initialPage = window.location.hash.slice(1);
    if (pages[initialPage]) state.activePage = initialPage;
    render();
  </script>
</body>
</html>
